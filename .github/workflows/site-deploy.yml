name: Site Deploy

on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Released version whose site zip to deploy (YY.WW.DD or YY.WW.DD-N)
        required: true
        type: string
      target:
        description: staging-then-production, or production alone for a rollback
        required: true
        type: choice
        default: staging-then-production
        options: [staging-then-production, production]

permissions: {}

concurrency:
  group: site-deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  CONFIG: .github/site-deploy.json
  SITE_ASSET_PREFIX: duvay-site

jobs:
  resolve:
    name: Find the released site zip
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
      version: ${{ steps.release.outputs.version }}
      sha256: ${{ steps.release.outputs.sha256 }}
      target: ${{ steps.release.outputs.target }}
    steps:
      - name: Checkout deploy tooling
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Find the release and its site zip
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
            TARGET="$INPUT_TARGET"
          else
            VERSION=$(git show "$HEAD_SHA:package.json" | jq -r .version)
            TARGET=staging-then-production
          fi
          if [[ ! "$VERSION" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?$ ]]; then
            echo "::error::Version $VERSION is not YY.WW.DD CalVer."
            exit 1
          fi
          TAG="v$VERSION"
          TAG_SHA=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" || true)
          if [[ "$EVENT" == "workflow_run" && "$TAG_SHA" != "$HEAD_SHA" ]]; then
            echo "::notice::$HEAD_SHA is not the release $TAG ($TAG_SHA); nothing to deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$TAG_SHA" ]]; then
            echo "::error::Release tag $TAG does not exist."
            exit 1
          fi
          ZIP="$SITE_ASSET_PREFIX-$VERSION.zip"
          mkdir -p site
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir site --pattern "$ZIP" --pattern "$ZIP.sha256"
          SHA256=$(cut -d' ' -f1 "site/$ZIP.sha256")
          bun scripts/site-deploy.mjs verify "site/$ZIP" "$SHA256"
          {
            echo "deploy=true"
            echo "version=$VERSION"
            echo "sha256=$SHA256"
            echo "target=$TARGET"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying $ZIP ($SHA256), target $TARGET"

      - name: Keep the zip for the deploy jobs
        if: steps.release.outputs.deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 7
          if-no-files-found: error

  deploy-staging:
    name: Deploy staging
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true' && needs.resolve.outputs.target != 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: site-staging
      url: https://staging.duvay.del.ma
    permissions:
      contents: read
      id-token: write
    env:
      BRANCH: staging
      VERSION: ${{ needs.resolve.outputs.version }}
      SHA256: ${{ needs.resolve.outputs.sha256 }}
    steps:
      - name: Checkout deploy tooling
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Download the site zip
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Verify the zip is the released one
        run: bun scripts/site-deploy.mjs verify "site/$SITE_ASSET_PREFIX-$VERSION.zip" "$SHA256"

      - name: Read the deploy role
        id: role
        run: echo "arn=$(jq -r ".roles.$BRANCH" "$CONFIG")" >> "$GITHUB_OUTPUT"

      - name: Assume the staging deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ca-central-1

      - name: Check the PaaS header policy
        run: bun scripts/site-deploy.mjs check-headers "$CONFIG"

      - name: Deploy to Amplify staging
        run: bun scripts/site-deploy.mjs deploy "$CONFIG" "$BRANCH" "site/$SITE_ASSET_PREFIX-$VERSION.zip"

      - name: Probe staging
        run: bun scripts/site-deploy.mjs probe "$CONFIG" "$BRANCH" "$VERSION"

  deploy-production:
    name: Deploy production
    needs: [resolve, deploy-staging]
    if: >-
      ${{
        always() &&
        needs.resolve.outputs.deploy == 'true' &&
        (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: site-production
      url: https://duvay.del.ma
    permissions:
      contents: read
      id-token: write
    env:
      BRANCH: production
      VERSION: ${{ needs.resolve.outputs.version }}
      SHA256: ${{ needs.resolve.outputs.sha256 }}
    steps:
      - name: Checkout deploy tooling
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Download the site zip
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Verify the zip is the one staging received
        run: bun scripts/site-deploy.mjs verify "site/$SITE_ASSET_PREFIX-$VERSION.zip" "$SHA256"

      - name: Read the deploy role
        id: role
        run: echo "arn=$(jq -r ".roles.$BRANCH" "$CONFIG")" >> "$GITHUB_OUTPUT"

      - name: Assume the production deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ca-central-1

      - name: Check the PaaS header policy
        run: bun scripts/site-deploy.mjs check-headers "$CONFIG"

      - name: Record the version production serves now
        id: previous
        run: |
          set -euo pipefail
          PREVIOUS=$(bun scripts/site-deploy.mjs live-version "$CONFIG" "$BRANCH")
          echo "version=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "Production serves '${PREVIOUS:-unknown}' before this deploy"

      - name: Deploy to Amplify production
        id: deploy
        run: bun scripts/site-deploy.mjs deploy "$CONFIG" "$BRANCH" "site/$SITE_ASSET_PREFIX-$VERSION.zip"

      - name: Probe production
        id: probe
        run: bun scripts/site-deploy.mjs probe "$CONFIG" "$BRANCH" "$VERSION"

      - name: Roll back to the previous version
        if: >-
          ${{
            failure() &&
            steps.probe.outcome == 'failure' &&
            steps.previous.outputs.version != '' &&
            steps.previous.outputs.version != env.VERSION
          }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.previous.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="$SITE_ASSET_PREFIX-$PREVIOUS.zip"
          mkdir -p previous
          gh release download "v$PREVIOUS" --repo "$GITHUB_REPOSITORY" --dir previous --pattern "$ZIP" --pattern "$ZIP.sha256"
          bun scripts/site-deploy.mjs verify "previous/$ZIP" "$(cut -d' ' -f1 "previous/$ZIP.sha256")"
          bun scripts/site-deploy.mjs deploy "$CONFIG" "$BRANCH" "previous/$ZIP"
          bun scripts/site-deploy.mjs probe "$CONFIG" "$BRANCH" "$PREVIOUS"
          echo "::error::Production probes failed for $VERSION; production is back on $PREVIOUS."
