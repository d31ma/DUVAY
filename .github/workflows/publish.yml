name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main commit SHA to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Validate immutable main source and CalVer
        id: release
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail

          git fetch --force origin +refs/heads/main:refs/remotes/origin/main --tags
          SOURCE_SHA=$(git rev-parse HEAD)
          MAIN_SHA=$(git rev-parse origin/main)
          VERSION=$(bun -p "require('./package.json').version")
          PACKAGE=$(bun -p "require('./package.json').name")

          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$SOURCE_SHA" != "$REQUESTED_SHA" ]]; then
            echo "::error::Requested source is not the checked-out commit."
            exit 1
          fi
          if [[ "$SOURCE_SHA" != "$MAIN_SHA" ]]; then
            echo "::error::Only the current immutable main SHA may publish."
            exit 1
          fi
          if [[ "$PACKAGE" != "@d31ma/duvay-css" ]]; then
            echo "::error::Unexpected package name: $PACKAGE"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "::error::Version must use YY.WW.DD CalVer."
            exit 1
          fi

          IFS=. read -r _ WEEK DAY <<< "$VERSION"
          if (( 10#$WEEK < 1 || 10#$WEEK > 53 || 10#$DAY < 1 || 10#$DAY > 7 )); then
            echo "::error::Version has an invalid ISO week or weekday."
            exit 1
          fi

          TAG="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_SHA=$(git rev-parse "refs/tags/$TAG^{}")
            if [[ "$TAG_SHA" != "$SOURCE_SHA" ]]; then
              echo "::error::Existing tag $TAG resolves to $TAG_SHA, not $SOURCE_SHA."
              exit 1
            fi
            if [[ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]]; then
              echo "::error::Existing tag $TAG is not annotated."
              exit 1
            fi
          fi

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  quality:
    name: Tooling unit tests
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install website dependencies
        run: cd website && bun install --frozen-lockfile

      - name: Test pinned Tachyon wrapper
        run: bun run --cwd website test:ty

      - name: Test CRAP counter
        run: bun scripts/crap.test.mjs

  test:
    name: Component tests (${{ matrix.shard }}/4)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install website dependencies
        run: cd website && bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bun --cwd website playwright install --with-deps chromium

      - name: Build framework
        run: bun run build

      - name: Run component tests
        run: bun run test:components -- --shard=${{ matrix.shard }}/4

  docs:
    name: Build documentation
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install website dependencies
        run: cd website && bun install --frozen-lockfile

      - name: Build framework
        run: bun run build

      - name: Build documentation site
        run: cd website && bun run bundle

  tag:
    name: Tag published source
    needs: [preflight, quality, test, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout published source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0

      - name: Create or verify annotated tag
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail

          git fetch --force origin +refs/heads/main:refs/remotes/origin/main --tags
          TAG="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_SHA=$(git rev-parse "refs/tags/$TAG^{}")
            if [[ "$TAG_SHA" != "$SOURCE_SHA" ]]; then
              echo "::error::Existing tag $TAG resolves to $TAG_SHA, not $SOURCE_SHA."
              exit 1
            fi
            if [[ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]]; then
              echo "::error::Existing tag $TAG is not annotated."
              exit 1
            fi
            echo "Annotated tag $TAG already identifies the published source."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$SOURCE_SHA" -m "$TAG"
            git push origin "refs/tags/$TAG"
          fi

  github-release:
    name: Create or repair GitHub release
    needs: [preflight, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Create or repair release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail

          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --draft=false \
              --prerelease=false
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --verify-tag \
              --title "$TAG" \
              --generate-notes
          fi
