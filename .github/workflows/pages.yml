name: Publish Pages Assets

on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact tagged source commit SHA to deploy
        required: true
        type: string
      version:
        description: Exact YY.WW.DD version to deploy
        required: true
        type: string

permissions: {}

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Build immutable asset site
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch') ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}

    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          path: source

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Verify version and annotated source tag
        id: release
        working-directory: source
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.event.workflow_run.head_sha }}
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          set -euo pipefail

          git fetch --force origin --tags
          SOURCE_SHA=$(git rev-parse HEAD)
          VERSION=$(bun -p "require('./package.json').version")

          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$SOURCE_SHA" != "$REQUESTED_SHA" ]]; then
            echo "::error::Requested source is not the checked-out commit."
            exit 1
          fi
          if [[ -n "$REQUESTED_VERSION" ]] && [[ "$VERSION" != "$REQUESTED_VERSION" ]]; then
            echo "::error::Requested version $REQUESTED_VERSION does not match package version $VERSION."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?$ ]]; then
            echo "::error::Version must use YY.WW.DD CalVer."
            exit 1
          fi

          TAG="v$VERSION"
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "::error::Annotated release tag $TAG does not exist."
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]]; then
            echo "::error::Release tag $TAG is not annotated."
            exit 1
          fi
          TAG_SHA=$(git rev-parse "refs/tags/$TAG^{}")
          if [[ "$TAG_SHA" != "$SOURCE_SHA" ]]; then
            echo "::error::Release tag $TAG resolves to $TAG_SHA, not $SOURCE_SHA."
            exit 1
          fi

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build DuVay
        working-directory: source
        run: bun run build

      - name: Checkout persistent Pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site

      - name: Stage immutable and latest assets
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          VERSION_DIR="site/versions/$VERSION"
          if [[ -d "$VERSION_DIR" ]] && [[ ! -f "$VERSION_DIR/.source-sha" ]]; then
            echo "::error::Version $VERSION predates immutable source metadata; refusing to overwrite it."
            exit 1
          fi
          if [[ -f "$VERSION_DIR/.source-sha" ]]; then
            EXISTING_SHA=$(<"$VERSION_DIR/.source-sha")
            if [[ "$EXISTING_SHA" != "$SOURCE_SHA" ]]; then
              echo "::error::Version $VERSION is already pinned to $EXISTING_SHA."
              exit 1
            fi

            UNSAFE_ENTRY=$(find "$VERSION_DIR" -mindepth 1 ! -type d ! -type f -print -quit)
            if [[ -n "$UNSAFE_ENTRY" ]]; then
              echo "::error::Version $VERSION contains an unsupported filesystem entry: $UNSAFE_ENTRY"
              exit 1
            fi

            SOURCE_MANIFEST=$(mktemp)
            VERSION_MANIFEST=$(mktemp)
            (
              cd source/dist
              LC_ALL=C find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
            ) > "$SOURCE_MANIFEST"
            (
              cd "$VERSION_DIR"
              LC_ALL=C find . -type f ! -path './.source-sha' -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
            ) > "$VERSION_MANIFEST"

            if ! cmp -s "$SOURCE_MANIFEST" "$VERSION_MANIFEST"; then
              echo "::error::Version $VERSION assets do not match the verified rebuild."
              diff -u "$SOURCE_MANIFEST" "$VERSION_MANIFEST" || true
              rm -f "$SOURCE_MANIFEST" "$VERSION_MANIFEST"
              exit 1
            fi
            rm -f "$SOURCE_MANIFEST" "$VERSION_MANIFEST"
          fi

          if [[ ! -d "$VERSION_DIR" ]]; then
            mkdir -p "$VERSION_DIR"
            cp -R source/dist/. "$VERSION_DIR/"
            printf '%s\n' "$SOURCE_SHA" > "$VERSION_DIR/.source-sha"
          fi

          UPDATE_LATEST=true
          if [[ -f site/latest/.version ]]; then
            LATEST_VERSION=$(<site/latest/.version)
            if [[ "$LATEST_VERSION" == "$VERSION" ]] && [[ -f site/latest/.source-sha ]] && \
              [[ "$(<site/latest/.source-sha)" != "$SOURCE_SHA" ]]; then
              echo "::error::Latest version $VERSION already identifies a different source."
              exit 1
            fi
            NEWEST=$(printf '%s\n%s\n' "$LATEST_VERSION" "$VERSION" | sort -V | tail -n 1)
            if [[ "$NEWEST" != "$VERSION" ]]; then
              UPDATE_LATEST=false
            fi
          fi

          if [[ "$UPDATE_LATEST" == "true" ]]; then
            rm -rf site/latest
            mkdir -p site/latest
            cp -R source/dist/. site/latest/
            printf '%s\n' "$SOURCE_SHA" > site/latest/.source-sha
            printf '%s\n' "$VERSION" > site/latest/.version

            cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>DuVay Assets</title>
          </head>
          <body>
            <main>
              <h1>DuVay Assets</h1>
              <p>Current release: <a href="./versions/$VERSION/">$VERSION</a></p>
              <p><a href="./latest/">Latest build</a></p>
              <p><a href="https://github.com/${GITHUB_REPOSITORY}">Source and documentation</a></p>
            </main>
          </body>
          </html>
          EOF
          else
            echo "Keeping newer latest release $LATEST_VERSION; preserving only version $VERSION."
          fi

      - name: Preserve release on gh-pages
        working-directory: site
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Pages assets are already current."
          else
            git commit -m "publish: v$VERSION"
            git push origin HEAD:gh-pages
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy asset site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
