<h1>Command Palette Item</h1>
<p>A structured option for <a href="/docs/components/command-palette">command palettes</a>. Set an <code>item</code> object as a JavaScript property when the value includes callbacks or richer data.</p>

<h2>Example</h2>
<demo-compare>
  <div slot="css"><button class="w-command-item"><span class="w-command-item-title">Deploy</span><kbd class="w-kbd">D</kbd></button></div>
  <div slot="wc"><w-command-palette-item item='{"title":"Deploy","value":"deploy","hotkey":"D"}'></w-command-palette-item></div>
</demo-compare>
