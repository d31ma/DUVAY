<h1>Highlight</h1>
<p>Highlight literal queries without injecting HTML. Use <code>match-all</code> and <code>ignore-case</code> for search results, or assign exact <code>matches</code> ranges as a JavaScript property.</p>

<h2>Example</h2>
<demo-compare>
  <div slot="css"><span class="w-highlight">DuVay makes <mark class="w-highlight-mark">search</mark> clear.</span></div>
  <div slot="wc"><w-highlight text="DuVay makes search clear." query="search" match-all></w-highlight></div>
</demo-compare>
