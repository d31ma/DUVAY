<doc-layout>
  <h1>Heatmap Cell</h1>
  <p>The standalone cell primitive accepts an <code>item</code> object property and exposes its row, column, and value through an accessible image label.</p>

  <h2>Example</h2>
  <demo-compare>
    <div slot="css"><span class="w-heatmap-cell" style="--w-heatmap-cell-color:var(--w-primary)"></span></div>
    <div slot="wc"><w-heatmap-cell item='{"row":"Monday","column":"AM","value":8,"color":"#1f6f8b"}'></w-heatmap-cell></div>
  </demo-compare>
</doc-layout>
