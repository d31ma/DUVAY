<doc-layout>
  <h1>Video</h1>
  <p>A native HTML video player with poster, source/track slots, start time, volume, aspect ratio, and optional DuVay controls. Native media semantics remain available through the inner <code>video</code> element and <code>srcObject</code> property.</p>

  <h2>Example</h2>
  <demo-compare>
    <div slot="css"><div class="w-video"><video controls aria-label="Example video"></video></div></div>
    <div slot="wc"><w-video controls-variant="mini" aspect-ratio="16/9" hide-fullscreen></w-video></div>
  </demo-compare>
</doc-layout>
