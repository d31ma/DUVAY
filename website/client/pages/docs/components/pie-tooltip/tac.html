<h1>Pie Tooltip</h1>
<p>A tooltip surface for pie data. Toggle it with <code>model-value</code> and pass the active segment through the <code>item</code> attribute or property.</p>

<h2>Example</h2>
<demo-compare>
  <div slot="css"><div class="w-pie-tooltip"><strong>Cached</strong><span>35</span></div></div>
  <div slot="wc"><w-pie-tooltip model-value item='{"title":"Cached","value":35}'></w-pie-tooltip></div>
</demo-compare>
