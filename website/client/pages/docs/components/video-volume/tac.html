<h1>Video Volume</h1>
<p>A horizontal or vertical volume slider. It emits native-named <code>input</code> plus <code>update:modelValue</code>, both carrying a normalized value from 0 to 1.</p>

<h2>Example</h2>
<demo-compare>
  <div slot="css"><label class="w-video-volume"><span>🔊</span><input type="range" min="0" max="1" value="0.6" aria-label="Volume" /></label></div>
  <div slot="wc"><w-video-volume label="Media volume" model-value="0.6"></w-video-volume></div>
</demo-compare>
