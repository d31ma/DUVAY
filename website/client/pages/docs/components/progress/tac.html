<doc-layout>
  <h1>Progress</h1>
  <p>The unified Vuetify 4 progress component switches between <code>linear</code> and <code>circular</code> with <code>type</code>. It can generate a label and formatted value, or accept custom slotted content.</p>

  <h2>Example</h2>
  <demo-compare>
    <div slot="css"><div class="w-progress"><div class="w-progress-bar" style="inline-size:65%"></div><div class="w-progress-content">65%</div></div></div>
    <div slot="wc"><w-progress type="linear" model-value="65" label="Upload" value-format="{percent}%"></w-progress></div>
  </demo-compare>
</doc-layout>
