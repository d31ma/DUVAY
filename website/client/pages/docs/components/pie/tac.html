<doc-layout>
  <h1>Pie</h1>
  <p>A responsive, accessible pie or donut chart rendered with native CSS. Provide item title/value keys, a palette, rotation, inner cut, reveal options, and an optional legend.</p>

  <h2>Example</h2>
  <demo-compare>
    <div slot="css"><figure class="w-pie"><div class="w-pie-chart" style="--w-pie-fill:conic-gradient(var(--w-primary) 0 35%,var(--w-warning) 35% 100%);--w-pie-inner-cut:55%"></div></figure></div>
    <div slot="wc"><w-pie title="Requests" inner-cut="55" legend items='[{"title":"Cached","value":35,"color":"#1f6f8b"},{"title":"Origin","value":65,"color":"#c47800"}]'></w-pie></div>
  </demo-compare>
</doc-layout>
