<h1>Month Picker</h1>
<p>Select a month, multiple months, or an inclusive month range. <code>months-columns</code> and <code>years-columns</code> control the grids; allowed-month/year rules can be supplied as arrays or JavaScript functions.</p>

<h2>Example</h2>
<demo-compare>
  <div slot="css"><div class="w-date-picker-months" style="--w-date-picker-columns:3"><button class="w-date-picker-month selected">Jan</button><button class="w-date-picker-month">Feb</button><button class="w-date-picker-month">Mar</button></div></div>
  <div slot="wc"><w-month-picker year="2026" model-value="2026-08" months-columns="4"></w-month-picker></div>
</demo-compare>
