<h1>Video Controls</h1>
<p>The accessible control strip used by <code>w-video</code>. Play, seek, volume, and fullscreen controls meet DuVay's touch-target and focus-indicator requirements.</p>

<h2>Example</h2>
<demo-compare>
  <div slot="css"><div class="w-video" style="min-height:8rem"><div class="w-video-controls"><button aria-label="Play">▶</button><input type="range" aria-label="Progress" /><span class="w-video-time">0:24 / 1:00</span></div></div></div>
  <div slot="wc"><div class="w-video" style="min-height:8rem"><w-video-controls progress="0.4" duration="60" split-time hide-fullscreen></w-video-controls></div></div>
</demo-compare>
