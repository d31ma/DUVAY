<h1>Avatar Group</h1>
<p>Collect avatars with overlap, reverse or vertical ordering, a visible-item limit, and an accessible overflow count. Supply authored <code>w-avatar</code> children or an <code>items</code> JSON array.</p>

<h2>Example</h2>
<demo-compare>
  <div slot="css"><div class="w-avatar-group"><span class="w-avatar">AL</span><span class="w-avatar">GH</span><span class="w-avatar-group-overflow">+2</span></div></div>
  <div slot="wc"><w-avatar-group size="48" gap="8" limit="2" items='[{"text":"AL"},{"text":"GH"},{"text":"KT"},{"text":"RM"}]'></w-avatar-group></div>
</demo-compare>
