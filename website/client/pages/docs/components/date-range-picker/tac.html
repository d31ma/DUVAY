<doc-layout>
  <h1>Date Range Picker</h1>
  <p>Select two inclusive endpoints with the same navigation, constraints, week settings, keyboard behavior, and header controls as <code>w-date-picker</code>. The comma-separated result is reflected through <code>model-value</code>.</p>

  <h2>Example</h2>
  <demo-compare>
    <div slot="css"><div class="w-date-picker"><div class="w-date-picker-grid"><button class="w-date-picker-day range-start">8</button><button class="w-date-picker-day in-range">9</button><button class="w-date-picker-day range-end">10</button></div></div></div>
    <div slot="wc"><w-date-range-picker month="8" year="2026" model-value="2026-08-08,2026-08-10"></w-date-range-picker></div>
  </demo-compare>
</doc-layout>
