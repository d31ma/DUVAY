<doc-layout>
  <h1>Pie Segment</h1>
  <p>A standalone radial segment for progress-like data. It exposes determinate progress semantics and shares pie color, rotation, active, reveal, and visibility options.</p>

  <h2>Example</h2>
  <demo-compare>
    <div slot="css"><span class="w-pie-chart" style="--w-pie-fill:conic-gradient(var(--w-success) 0 42%,var(--w-surface-container-high) 42%)"></span></div>
    <div slot="wc"><w-pie-segment value="42" color="#2e7d32" inner-cut="60"></w-pie-segment></div>
  </demo-compare>
</doc-layout>
