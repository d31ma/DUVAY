<!doctype html>
<html lang="en" w-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DuVay component test page</title>
    <link rel="stylesheet" href="../../src/duvay.css">
    <!-- Every skin, loaded together. Each is scoped to its own [w-os="…"], so
         they are inert until the attribute is set — which is exactly how the
         docs site carries all five at once. The runner sets `w-os` per project,
         so one page serves every skin without a fixture per platform. -->
    <link rel="stylesheet" href="../../src/platforms/ios.css">
    <link rel="stylesheet" href="../../src/platforms/material.css">
    <link rel="stylesheet" href="../../src/platforms/macos.css">
    <link rel="stylesheet" href="../../src/platforms/fluent.css">
    <link rel="stylesheet" href="../../src/platforms/adwaita.css">
    <link rel="stylesheet" href="../../src/platforms/web.css">
    <script>
      // Records every tag the framework registers so smoke.spec.js can mount
      // them all without re-deriving the list from source.
      window.__wTags = [];
      const wDefine = customElements.define.bind(customElements);
      customElements.define = function (name, ...rest) {
        window.__wTags.push(name);
        return wDefine(name, ...rest);
      };
    </script>
    <script type="module" src="../../src/duvay-wc.js"></script>
    <script src="../../src/duvay-directives.js"></script>
    <style>
      body {
        min-height: 100vh;
      }

      #root {
        padding: 24px;
      }
    </style>
  </head>
  <body class="w-body">
    <main id="root"></main>
  </body>
</html>
